# .github/workflows/test.yml
# runs on every PR — fast feedback
name: Test

on:
  pull_request:
    branches: [main, develop]

jobs:
  #   unit-tests:
  #     runs-on: ubuntu-latest
  #     steps:
  #       - uses: actions/checkout@v4

  #       - uses: actions/setup-node@v4
  #         with:
  #           node-version: 18
  #           cache: 'npm'

  #       - name: Install dependencies
  #         run: npm ci

  #       - name: Run Jest tests
  #         run: npm test

  e2e-tests:
    runs-on: macos-latest # iOS simulator needs macOS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install applesimutils # ✅ add this
        run: |
          brew tap wix/brew
          brew install applesimutils

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Prebuild
        run: npx expo prebuild
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build for Detox
        run: npx detox build --configuration ios.sim.debug

      - name: Run Detox tests
        run: npx detox test --configuration ios.sim.debug
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
